[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "soup-release-demo-darkak06-20261116"
version = "0.9.4"
description = "Small CLI for an auditable release-pipeline exercise"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Soup exercise contributor"}]
dependencies = ["click==8.1.8"]

[project.scripts]
soupdemo = "soupdemo.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "build==1.3.0", "twine==6.2.0", "ruff==0.14.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
soupdemo = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
